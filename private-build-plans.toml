# Put your custom build plans here

[buildPlans.BababoiForever]
family = "Bababoi forever"
spacing = "fontconfig-mono"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.BababoiForever.variants.design]
one = "base-flat-top-serif"
four = "closed-serifless"
five = "upright-arched-serifless"
six = "closed-contour"
seven = "straight-serifed"
eight = "two-circles"
nine = "closed-contour"
zero = "dotted"
capital-a = "curly-serifless"
capital-c = "serifless"
capital-f = "serifless"
capital-g = "flat-bottom-serifless-hooked"
capital-m = "flat-bottom-serifless"
capital-q = "curly-tailed"
capital-r = "straight-serifless"
capital-s = "serifless"
capital-v = "straight-serifless"
capital-w = "straight-flat-top-serifless"
capital-z = "straight-serifless"
a = "double-storey-hook-inward-serifed-tailed"
b = "toothed-serifed"
f = "flat-hook-serifed"
g = "single-storey-flat-hook-serifless"
i = "zshaped"
k = "straight-serifless"
l = "serifed-flat-tailed"
m = "serifless"
r = "compact-serifed"
t = "flat-hook-short-neck2"
w = "straight-flat-top-serifless"
y = "straight-turn-serifless"
punctuation-dot = "square"
ellipsis-density = "dense"
tilde = "low"
underscore = "low"
caret = "medium"
ascii-single-quote = "raised-comma"
paren = "flat-arc"
brace = "straight"
guillemet = "straight"
at = "fourfold"
cent = "open"
percent = "rings-segmented-slash"
question = "smooth"

[buildPlans.BababoiForever.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.BababoiForever.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.BababoiForever.widths.Condensed]
shape = 500
menu = 3
css = "condensed"

[buildPlans.BababoiForever.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.BababoiForever.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.BababoiForever.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
